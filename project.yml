name: TaiwanStockTracker
options:
  bundleIdPrefix: com.twstock
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
    AD_HOC_CODE_SIGNING_ALLOWED: "YES"

targets:
  TaiwanStockTracker:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twstock.tracker
        INFOPLIST_KEY_CFBundleDisplayName: "台股績效"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: Shared/TaiwanStockTracker.entitlements
    dependencies:
      - target: TaiwanStockWidgetExtension

  TaiwanStockWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twstock.tracker.widget
        INFOPLIST_KEY_CFBundleDisplayName: "台股監控小工具"
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CODE_SIGN_ENTITLEMENTS: Shared/TaiwanStockWidgetExtension.entitlements
    frameworks:
      - framework: WidgetKit.framework
      - framework: SwiftUI.framework
