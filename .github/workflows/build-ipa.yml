name: Build TaiwanStockTracker IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project from YAML
        run: xcodegen generate

      - name: Build Archive (No Code Sign)
        run: |
          xcodebuild clean archive \
            -project TaiwanStockTracker.xcodeproj \
            -scheme TaiwanStockTracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/TaiwanStockTracker.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          APP_PATH="build/TaiwanStockTracker.xcarchive/Products/Applications/TaiwanStockTracker.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: $APP_PATH not found!"
            find build -name "*.app"
            exit 1
          fi

          echo "Found compiled app bundle:"
          ls -la "$APP_PATH"

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -qry TaiwanStockTracker.ipa Payload
          echo "Generated IPA size:"
          ls -lh TaiwanStockTracker.ipa

          echo "IPA Manifest:"
          unzip -l TaiwanStockTracker.ipa
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TaiwanStockTracker-IPA
          path: build/TaiwanStockTracker.ipa
          retention-days: 14
