name: Build TaiwanStockTracker IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project from YAML
        run: xcodegen generate

      - name: Build Archive (No Code Sign)
        run: |
          xcodebuild clean archive \
            -project TaiwanStockTracker.xcodeproj \
            -scheme TaiwanStockTracker \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/TaiwanStockTracker.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/TaiwanStockTracker.xcarchive/Products/Applications/TaiwanStockTracker.app build/Payload/
          cd build
          zip -r TaiwanStockTracker.ipa Payload
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TaiwanStockTracker-IPA
          path: build/TaiwanStockTracker.ipa
          retention-days: 14
